name: Highlight REST API changes

on:
  pull_request:
    types: [closed]

concurrency:
  group: highlight-rest-api-changes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  notify-rest-api-changes:
    name: Notify REST API changes
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          list-files: 'json'
          filters: |
            rest_v2:
              - 'includes/classes/rest-api/controllers/v2/**'
              - 'includes/classes/rest-api/class-cocart-rest-api.php'
              - 'includes/classes/rest-api/class-cocart-response.php'
              - 'includes/classes/rest-api/class-cocart-authentication.php'

      - name: Comment on PR to remind about API docs
        if: steps.filter.outputs.rest_v2 == 'true'
        uses: actions/github-script@v7
        env:
          CHANGED_FILES: ${{ join(fromJson(steps.filter.outputs.rest_v2_files || '[]'), '\n') }}
        with:
          script: |
            const files = process.env.CHANGED_FILES;
            github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `⚠️ **REST API Change Detected**\n\nHi @${{ github.event.pull_request.user.login }}! This PR contains changes to REST API files. Please ensure any public-facing API changes are documented.\n\nChanged API files:\n\`\`\`\n${files}\n\`\`\``
            });

      - name: Trigger OpenAPI spec update
        if: steps.filter.outputs.rest_v2 == 'true'
        uses: actions/github-script@v7
        env:
          CHANGED_FILES: ${{ join(fromJson(steps.filter.outputs.rest_v2_files || '[]'), '\n') }}
        with:
          github-token: ${{ secrets.OPENAPI_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'co-cart',
              repo: 'cocart-openapi',
              event_type: 'rest-api-changed',
              client_payload: {
                pr_number: ${{ github.event.pull_request.number }},
                pr_title: '${{ github.event.pull_request.title }}',
                pr_url: '${{ github.event.pull_request.html_url }}',
                source_repo: '${{ github.repository }}',
                changed_files: process.env.CHANGED_FILES
              }
            });
